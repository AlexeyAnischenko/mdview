<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 270" width="720" height="270" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <title>mdview: Markdown in, rendered page out</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f1b33"/>
      <stop offset="1" stop-color="#1d2f57"/>
    </linearGradient>
    <linearGradient id="badge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4493f8"/>
      <stop offset="1" stop-color="#8957e5"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity=".35"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 10 5 0 10z" fill="#9db7e6"/>
    </marker>
  </defs>

  <rect width="720" height="270" rx="16" fill="url(#bg)"/>
  <g fill="#ffffff" opacity=".05">
    <circle cx="660" cy="40" r="90"/><circle cx="60" cy="250" r="70"/>
  </g>

  <!-- Markdown source -->
  <g filter="url(#shadow)">
    <rect x="30" y="40" width="190" height="190" rx="10" fill="#0d1117" stroke="#3d444d"/>
    <rect x="30" y="40" width="190" height="26" rx="10" fill="#151b23"/>
    <rect x="30" y="56" width="190" height="10" fill="#151b23"/>
  </g>
  <circle cx="46" cy="53" r="4" fill="#f85149"/><circle cx="60" cy="53" r="4" fill="#d29922"/><circle cx="74" cy="53" r="4" fill="#3fb950"/>
  <text x="206" y="57" font-size="11" fill="#9198a1" text-anchor="end">notes.md</text>
  <g font-family="Consolas, Menlo, monospace" font-size="12">
    <text x="44" y="88" fill="#ff7b72"># Release notes</text>
    <text x="44" y="110" fill="#c9d1d9">Some <tspan fill="#ffa657">**bold**</tspan> text</text>
    <text x="44" y="132" fill="#c9d1d9"><tspan fill="#ff7b72">-</tspan> [x] shipped</text>
    <text x="44" y="154" fill="#79c0ff">| a | b |</text>
    <text x="44" y="176" fill="#a5d6ff">$E = mc^2$</text>
    <text x="44" y="198" fill="#7ee787">```mermaid</text>
    <text x="44" y="216" fill="#8b949e">graph LR; A--&gt;B</text>
  </g>

  <!-- mdview -->
  <path d="M230 135 H 292" stroke="#9db7e6" stroke-width="2.5" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
  <g filter="url(#shadow)">
    <circle cx="350" cy="135" r="52" fill="url(#badge)"/>
  </g>
  <circle cx="350" cy="135" r="52" fill="none" stroke="#ffffff" stroke-opacity=".35" stroke-width="2"/>
  <path d="M326 152v-34h8l8 12 8-12h8v34h-8v-21l-8 12-8-12v21z" fill="#fff"/>
  <path d="M366 140l8 12 8-12h-5v-22h-6v22z" fill="#fff" opacity=".9"/>
  <text x="350" y="208" font-size="14" font-weight="600" fill="#e6edf3" text-anchor="middle">mdview.html</text>
  <path d="M408 135 H 470" stroke="#9db7e6" stroke-width="2.5" stroke-dasharray="6 5" marker-end="url(#arrow)"/>

  <!-- Rendered page -->
  <g filter="url(#shadow)">
    <rect x="480" y="40" width="210" height="190" rx="10" fill="#ffffff"/>
  </g>
  <text x="496" y="70" font-size="16" font-weight="700" fill="#1f2328">Release notes</text>
  <rect x="496" y="77" width="178" height="1" fill="#d1d9e0"/>
  <text x="496" y="96" font-size="11" fill="#1f2328">Some <tspan font-weight="700">bold</tspan> text</text>
  <rect x="496" y="104" width="10" height="10" rx="2" fill="#0969da"/>
  <path d="M498 109l2.5 2.5 4-5" stroke="#fff" stroke-width="1.6" fill="none"/>
  <text x="511" y="113" font-size="11" fill="#1f2328">shipped</text>
  <g font-size="10" fill="#1f2328">
    <rect x="496" y="122" width="80" height="34" fill="none" stroke="#d1d9e0"/>
    <rect x="496" y="122" width="80" height="17" fill="#f6f8fa" stroke="#d1d9e0"/>
    <path d="M536 122v34" stroke="#d1d9e0"/>
    <text x="512" y="134" font-weight="600">a</text><text x="552" y="134" font-weight="600">b</text>
    <text x="510" y="151">1</text><text x="550" y="151">2</text>
  </g>
  <text x="590" y="145" font-size="14" font-style="italic" font-family="Times New Roman, serif" fill="#1f2328">E = mc<tspan dy="-6" font-size="9">2</tspan></text>
  <g font-size="10" fill="#1f2328">
    <rect x="512" y="176" width="44" height="26" rx="4" fill="#ececff" stroke="#9370db"/>
    <text x="534" y="193" text-anchor="middle">A</text>
    <path d="M556 189 H 600" stroke="#333" stroke-width="1.2" marker-end="url(#arrow)"/>
    <rect x="608" y="176" width="44" height="26" rx="4" fill="#ececff" stroke="#9370db"/>
    <text x="630" y="193" text-anchor="middle">B</text>
  </g>
</svg>
