<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>mdview</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3' fill='%230969da'/%3E%3Cpath d='M3 11V5h1.5L6 7l1.5-2H9v6H7.5V7.5L6 9.5 4.5 7.5V11zm8 0-2-2.5h1.3V5h1.4v3.5H13z' fill='%23fff'/%3E%3C/svg%3E">
<!-- mdview — single-file Markdown viewer. Generated by build.mjs from src/template.html; edit the template, not this file.
     Bundled: /*@INLINE:versions*/
     Third-party licenses: see the "third-party-notices" element at the end of this file. -->
<style>/*@INLINE:gh-css*/</style>
<style>/*@INLINE:hljs-css*/</style>
<style>
:root {
  --bar-bg: #f6f8fa; --bar-fg: #1f2328; --bar-border: #d1d9e0; --muted: #59636e;
  --page-bg: #ffffff; --accent: #0969da; --toc-active-bg: #ddf4ff; --drop-bg: rgba(9, 105, 218, .08);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bar-bg: #151b23; --bar-fg: #f0f6fc; --bar-border: #3d444d; --muted: #9198a1;
    --page-bg: #0d1117; --accent: #4493f8; --toc-active-bg: #121d2f; --drop-bg: rgba(68, 147, 248, .12);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bar-bg: #151b23; --bar-fg: #f0f6fc; --bar-border: #3d444d; --muted: #9198a1;
  --page-bg: #0d1117; --accent: #4493f8; --toc-active-bg: #121d2f; --drop-bg: rgba(68, 147, 248, .12);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--page-bg); }
body { font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif; color: var(--bar-fg); }

#bar {
  position: sticky; top: 0; z-index: 10; display: flex; align-items: center; gap: 6px;
  height: 44px; padding: 0 12px; background: var(--bar-bg); border-bottom: 1px solid var(--bar-border);
}
#bar .name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 600; }
#bar .name small { font-weight: 400; color: var(--muted); margin-left: 8px; }
#bar button, #bar label {
  display: inline-flex; align-items: center; gap: 4px; height: 28px; padding: 0 10px;
  font: inherit; color: inherit; background: transparent; border: 1px solid var(--bar-border); border-radius: 6px; cursor: pointer;
  white-space: nowrap;
}
#bar button:hover, #bar label:hover { border-color: var(--muted); }
#bar label input { margin: 0; }
#bar [hidden] { display: none; }

#layout { display: flex; align-items: flex-start; }
#toc {
  position: sticky; top: 44px; flex: 0 0 260px; max-height: calc(100vh - 44px); overflow: auto;
  padding: 16px 8px 32px 12px; border-right: 1px solid var(--bar-border); font-size: 13px;
}
#toc[hidden] { display: none; }
#toc ul { list-style: none; margin: 0; padding: 0; }
#toc a { display: block; padding: 3px 8px; border-radius: 6px; color: var(--bar-fg); text-decoration: none; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
#toc a:hover { background: var(--toc-active-bg); }
#toc a.active { background: var(--toc-active-bg); color: var(--accent); font-weight: 600; }
#toc .l2 { padding-left: 16px; } #toc .l3 { padding-left: 28px; } #toc .l4 { padding-left: 40px; }
main { flex: 1; min-width: 0; }
.markdown-body { max-width: 980px; margin: 0 auto; padding: 32px 45px 96px; }
@media (max-width: 900px) { #toc { display: none; } }
@media (max-width: 767px) { .markdown-body { padding: 16px; } }

.markdown-body pre code.hljs { padding: 0 !important; background: transparent !important; overflow: visible; } /* the <pre> already has them */
.markdown-body pre { position: relative; }
.markdown-body pre .copy {
  position: absolute; top: 6px; right: 6px; padding: 2px 8px; font: 12px/1.6 inherit; color: var(--muted);
  background: var(--bar-bg); border: 1px solid var(--bar-border); border-radius: 6px; cursor: pointer; opacity: 0; transition: opacity .15s;
}
.markdown-body pre:hover .copy, .markdown-body pre .copy:focus { opacity: 1; }
.markdown-body pre.mermaid { background: transparent; text-align: center; }
.markdown-body .plantuml-diagram { margin: 0 0 16px; overflow-x: auto; text-align: center; }
.markdown-body .plantuml-diagram svg { max-width: 100%; height: auto; }
.markdown-body .math-display { overflow-x: auto; overflow-y: hidden; margin: 0 0 16px; }
.markdown-body .anchor { float: left; margin-left: -20px; padding-right: 4px; color: var(--muted); text-decoration: none; opacity: 0; }
.markdown-body :is(h1, h2, h3, h4, h5, h6):hover .anchor { opacity: 1; }
.markdown-body .frontmatter { font-size: 12px; }
.markdown-body li:has(> input[type="checkbox"]:first-child) { list-style: none; }
.markdown-body li > input[type="checkbox"]:first-child { margin: 0 .3em .2em -1.4em; vertical-align: middle; }
.markdown-body .markdown-alert-title { font-weight: 600; }

#msg { max-width: 760px; margin: 48px auto; padding: 0 24px; }
#msg h1 { font-size: 24px; margin: 0 0 8px; }
#msg .err { padding: 12px 16px; border: 1px solid #d1242f; border-radius: 6px; color: #d1242f; background: rgba(209, 36, 47, .06); word-break: break-word; }
#msg code, #msg pre { font: 12px/1.5 ui-monospace, SFMono-Regular, Consolas, monospace; background: var(--bar-bg); border-radius: 4px; }
#msg code { padding: 1px 4px; }
#msg pre { padding: 10px 12px; overflow: auto; border: 1px solid var(--bar-border); }
#msg ol li { margin: 8px 0; }
#msg .drop-hint { margin: 24px 0; padding: 32px; text-align: center; border: 2px dashed var(--bar-border); border-radius: 12px; color: var(--muted); }

#drop { position: fixed; inset: 0; z-index: 20; display: none; place-items: center; background: var(--drop-bg); border: 3px dashed var(--accent); font-size: 20px; color: var(--accent); pointer-events: none; }
body.dragging #drop { display: grid; }

@media print {
  #bar, #toc, #drop, .copy, .anchor { display: none !important; }
  .markdown-body { max-width: none; padding: 0; }
}
</style>
</head>
<body>
<header id="bar">
  <button id="btn-toc" title="Table of contents (T)" hidden>☰</button>
  <div class="name" id="name">mdview</div>
  <button id="btn-open" title="Open a .md file (Ctrl+O)">Open…</button>
  <button id="btn-reload" title="Reload (R)" hidden>↻</button>
  <label id="lbl-watch" title="Re-render when the file changes on disk" hidden><input type="checkbox" id="chk-watch" checked> Watch</label>
  <button id="btn-theme" title="Theme: auto / light / dark">Auto</button>
</header>
<div id="layout">
  <nav id="toc" hidden></nav>
  <main>
    <article id="doc" class="markdown-body" hidden></article>
    <div id="msg"></div>
  </main>
</div>
<div id="drop">Drop a Markdown file to view it</div>
<input type="file" id="picker" accept=".md,.markdown,.mdown,.mkd,.mdx,.txt,text/markdown,text/plain" hidden>

<!-- Libraries, gzipped + base64. The first four load at startup; katex and mermaid only when a document needs them. -->
<script type="application/gzip-base64" id="lib-marked">/*@INLINE:marked*/</script>
<script type="application/gzip-base64" id="lib-footnote">/*@INLINE:footnote*/</script>
<script type="application/gzip-base64" id="lib-purify">/*@INLINE:purify*/</script>
<script type="application/gzip-base64" id="lib-hljs">/*@INLINE:hljs*/</script>
<script type="application/gzip-base64" id="lib-katex">/*@INLINE:katex*/</script>
<script type="application/gzip-base64" id="lib-katex-css">/*@INLINE:katex-css*/</script>
<script type="application/gzip-base64" id="lib-mermaid">/*@INLINE:mermaid*/</script>
<script type="application/gzip-base64" id="lib-plantuml-viz">/*@INLINE:plantuml-viz*/</script>
<script type="application/gzip-base64" id="lib-plantuml-themes">/*@INLINE:plantuml-themes*/</script>
<script type="application/gzip-base64" id="lib-plantuml">/*@INLINE:plantuml*/</script>

<script>
(() => {
'use strict';

const $ = (s) => document.querySelector(s);
const doc = $('#doc'), msg = $('#msg'), toc = $('#toc');
const MD_EXT = /\.(md|markdown|mdown|mkd|mdx)$/i;
const POLL_MS = 1000;

// Current source: { kind: 'url', url } | { kind: 'handle', handle, name } | { kind: 'file', file, name }
let source = null;
let lastText = null, lastStamp = null, pollTimer = null, polling = false;

const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const store = {
  get(k) { try { return localStorage.getItem('mdview.' + k); } catch { return null; } },
  set(k, v) { try { localStorage.setItem('mdview.' + k, v); } catch { /* storage unavailable */ } },
};

// ---- Bundled libraries ---------------------------------------------------------------------
const libs = {};
function lib(name) { // unpacks and runs a bundled library once; resolves when it is ready
  return libs[name] ??= (async () => {
    const b64 = document.getElementById('lib-' + name).textContent.trim();
    const packed = await fetch('data:application/octet-stream;base64,' + b64);
    const text = await new Response(packed.body.pipeThrough(new DecompressionStream('gzip'))).text();
    const el = document.createElement(name.endsWith('-css') ? 'style' : 'script');
    el.textContent = text;
    document.head.appendChild(el); // inline scripts run synchronously on insertion
  })();
}

// ---- Theme ---------------------------------------------------------------------------------
const THEMES = ['auto', 'light', 'dark'];
let theme = THEMES.includes(store.get('theme')) ? store.get('theme') : 'auto';
const darkQuery = matchMedia('(prefers-color-scheme: dark)');
const isDark = () => theme === 'dark' || (theme === 'auto' && darkQuery.matches);
function applyTheme() {
  if (theme === 'auto') delete document.documentElement.dataset.theme;
  else document.documentElement.dataset.theme = theme;
  $('#btn-theme').textContent = theme[0].toUpperCase() + theme.slice(1);
}
function cycleTheme() {
  theme = THEMES[(THEMES.indexOf(theme) + 1) % THEMES.length];
  store.set('theme', theme);
  applyTheme();
  rerenderForTheme();
}
darkQuery.addEventListener('change', () => { if (theme === 'auto') rerenderForTheme(); });
function rerenderForTheme() { if (lastText != null && doc.querySelector('pre.mermaid, pre.plantuml, .plantuml-diagram')) render(lastText, true); } // diagrams bake in theme colors

// ---- Markdown -> HTML ----------------------------------------------------------------------
let slugs = new Map();
function slugify(text) {
  let base = text.toLowerCase().trim().replace(/[^\p{L}\p{N}\p{M}\s_-]/gu, '').replace(/\s/g, '-') || 'section';
  let slug = base, n = slugs.get(base) || 0;
  if (n) slug = base + '-' + n;
  slugs.set(base, n + 1);
  return slug;
}
const plain = (html) => { const d = document.createElement('div'); d.innerHTML = html; return d.textContent; };

function tex(src, display) {
  if (!window.katex) return esc(display ? `$$${src}$$` : `$${src}$`);
  const html = katex.renderToString(src, { displayMode: display, throwOnError: false, output: 'htmlAndMathml' });
  return display ? `<div class="math-display">${html}</div>` : html;
}

const mathExtension = {
  extensions: [
    {
      name: 'mathBlock', level: 'block',
      start(src) { const i = src.indexOf('$$'); return i < 0 ? undefined : i; },
      tokenizer(src) {
        const m = /^\$\$([\s\S]+?)\$\$[^\S\n]*(?:\n|$)/.exec(src);
        if (m) return { type: 'mathBlock', raw: m[0], text: m[1].trim() };
      },
      renderer(t) { return tex(t.text, true) + '\n'; },
    },
    {
      name: 'mathInline', level: 'inline',
      start(src) { const i = src.indexOf('$'); return i < 0 ? undefined : i; },
      tokenizer(src) {
        let m = /^\$`([^`]+)`\$/.exec(src); // GitHub's $`...`$ form
        if (m) return { type: 'mathInline', raw: m[0], text: m[1], display: false };
        m = /^\$\$(?!\s)([^$\n]+?)\$\$/.exec(src);
        if (m) return { type: 'mathInline', raw: m[0], text: m[1], display: true };
        // $...$ — no space just inside the delimiters and no digit right after, so "$5 and $10" stays text
        m = /^\$(?![\s$])((?:\\.|[^\\$\n])+?)(?<!\s)\$(?![0-9])/.exec(src);
        if (m) return { type: 'mathInline', raw: m[0], text: m[1], display: false };
      },
      renderer(t) { return tex(t.text, t.display); },
    },
  ],
};

const setupMarked = () => marked.use({ gfm: true }, markedFootnote(), mathExtension, {
  renderer: {
    heading({ tokens, depth }) {
      const inner = this.parser.parseInline(tokens);
      const id = slugify(plain(inner));
      return `<h${depth} id="${esc(id)}"><a class="anchor" href="#${esc(id)}" aria-hidden="true">#</a>${inner}</h${depth}>\n`;
    },
    code({ text, lang }) {
      const l = (lang || '').match(/^\S*/)[0].toLowerCase();
      if (l === 'mermaid') return `<pre class="mermaid">${esc(text)}</pre>\n`;
      if ((l === 'plantuml' || l === 'puml') && HAS_PLANTUML) return `<pre class="plantuml">${esc(text)}</pre>\n`;
      if (l === 'math' && window.katex) return tex(text, true) + '\n';
      let body = esc(text);
      if (l && hljs.getLanguage(l)) {
        try { body = hljs.highlight(text, { language: l, ignoreIllegals: true }).value; } catch { /* keep plain */ }
      }
      return `<pre><code class="hljs${l ? ' language-' + esc(l) : ''}">${body}</code></pre>\n`;
    },
  },
});

function frontMatterTable(yaml) {
  const rows = [];
  for (const line of yaml.split(/\r?\n/)) {
    const m = /^([\w.-]+)\s*:\s*(.*)$/.exec(line);
    if (m) rows.push([m[1], m[2]]);
    else if (rows.length && line.trim()) rows[rows.length - 1][1] += '\n' + line.trim();
  }
  if (!rows.length) return '';
  return '<table class="frontmatter"><thead><tr>' + rows.map((r) => `<th>${esc(r[0])}</th>`).join('') +
    '</tr></thead><tbody><tr>' + rows.map((r) => `<td>${esc(r[1])}</td>`).join('') + '</tr></tbody></table>\n';
}

// ---- Rendering -----------------------------------------------------------------------------
let renderSeq = 0;
async function render(text, keepScroll) {
  const seq = ++renderSeq;
  await ready; // a file dropped right after page load can arrive before the libraries are unpacked
  const y = scrollY;
  lastText = text;
  let md = text.replace(/^\uFEFF/, '');
  let front = '';
  const fm = /^---\r?\n([\s\S]*?)\r?\n(?:---|\.\.\.)[^\S\r\n]*(?:\r?\n|$)/.exec(md);
  if (fm) { front = frontMatterTable(fm[1]); md = md.slice(fm[0].length); }
  if (md.includes('$') || /^\s*(```|~~~)\s*math/m.test(md)) await Promise.all([lib('katex'), lib('katex-css')]);
  if (seq !== renderSeq) return; // a newer render started while the library loaded

  slugs = new Map();
  const html = front + marked.parse(md);
  doc.innerHTML = DOMPurify.sanitize(html, { ADD_ATTR: ['target'] });
  msg.innerHTML = '';
  doc.hidden = false;

  rewriteLinks();
  makeAlerts();
  addCopyButtons();
  buildToc();
  const h1 = doc.querySelector('h1');
  document.title = (h1 ? h1.textContent.replace(/^#/, '').trim() + ' — ' : '') + sourceName();
  Promise.all([renderMermaid(), renderPlantuml()]).then(() => {
    if (keepScroll) scrollTo(0, y);
    else if (location.hash) document.getElementById(decodeURIComponent(location.hash.slice(1)))?.scrollIntoView();
  });
  if (keepScroll) scrollTo(0, y);
}

async function renderMermaid() {
  const nodes = [...doc.querySelectorAll('pre.mermaid')];
  if (!nodes.length) return;
  await lib('mermaid');
  mermaid.initialize({ startOnLoad: false, securityLevel: 'strict', theme: isDark() ? 'dark' : 'default' });
  try { await mermaid.run({ nodes }); } catch (e) { console.warn('mermaid:', e); }
  nodes.forEach((n) => n.classList.add('mermaid-done'));
}

// PlantUML runs fully in the page (@plantuml/core: PlantUML compiled to JS by TeaVM, plus Graphviz via viz.js).
const HAS_PLANTUML = !!document.getElementById('lib-plantuml');
// `!include <C4/...>` and other standard-library includes are fetched from here, only when a diagram uses one.
window.PLANTUML_STDLIB_BASE = 'https://plantuml.github.io/plantuml/js-plantuml/';
let plantumlSeq = 0;

async function renderPlantuml() {
  const nodes = [...doc.querySelectorAll('pre.plantuml')];
  if (!nodes.length) return;
  await Promise.all([lib('plantuml-viz'), lib('plantuml-themes')]);
  await lib('plantuml');
  for (const pre of nodes) { // one at a time: the engine doesn't support concurrent renders
    if (!pre.isConnected) return; // a newer render replaced the document
    let src = pre.textContent.trim();
    if (!/^@start/.test(src)) src = `@startuml\n${src}\n@enduml`;
    const out = document.createElement('div');
    out.className = 'plantuml-diagram';
    out.id = 'plantuml-' + ++plantumlSeq;
    pre.replaceWith(out);
    await plantumlInto(out, src);
  }
}

function plantumlInto(out, src) { // render() writes the SVG asynchronously and has no callback
  return new Promise((resolve) => {
    const finish = (error) => {
      observer.disconnect();
      clearTimeout(timer);
      if (error) out.innerHTML = `<pre class="plantuml-error">PlantUML: ${esc(error)}</pre>`;
      else out.innerHTML = DOMPurify.sanitize(out.innerHTML, { USE_PROFILES: { svg: true, svgFilters: true } });
      resolve();
    };
    const observer = new MutationObserver(() => { if (out.querySelector('svg')) finish(); });
    observer.observe(out, { childList: true, subtree: true });
    const timer = setTimeout(() => finish('rendering timed out'), 30000);
    try { plantumlCore.render(src.split(/\r\n|\r|\n/), out.id, { dark: isDark() }); } catch (e) { finish(e.message || String(e)); }
  });
}

// Base URL that relative links and images in the document resolve against (null for dropped files).
const baseUrl = () => (source && source.kind === 'url' ? source.url : null);
const isAbsolute = (u) => /^([a-z][a-z0-9+.-]*:|\/\/)/i.test(u);

// The ?file= value that points the viewer at an absolute document URL.
function fileParamFor(url) {
  const u = new URL(url);
  if (u.origin === location.origin && u.pathname.startsWith('/@fs/')) return decodeURIComponent(u.pathname.slice(4)).replace(/^\/(?=[a-z]:)/i, '');
  if (u.protocol === 'file:') return decodeURIComponent(u.pathname).replace(/^\/(?=[a-z]:)/i, '');
  if (u.origin === location.origin) return decodeURIComponent(u.pathname);
  return u.href;
}
const viewerHref = (url) => {
  const u = new URL(url);
  return location.pathname + '?file=' + encodeURIComponent(fileParamFor(u.origin + u.pathname)) + u.hash;
};

function rewriteLinks() {
  const base = baseUrl();
  for (const el of doc.querySelectorAll('img[src], source[src], video[src], audio[src]')) {
    const src = el.getAttribute('src');
    if (base && !isAbsolute(src)) el.src = new URL(src, base).href;
  }
  for (const a of doc.querySelectorAll('a[href]')) {
    const href = a.getAttribute('href');
    if (href.startsWith('#')) continue;
    let abs;
    try { abs = base && !isAbsolute(href) ? new URL(href, base) : new URL(href); } catch { continue; }
    if (MD_EXT.test(abs.pathname) && (abs.protocol === 'file:' || abs.origin === location.origin || base)) {
      a.href = viewerHref(abs.href);
    } else {
      if (base) a.href = abs.href;
      if (/^https?:$/.test(abs.protocol) && abs.origin !== location.origin) { a.target = '_blank'; a.rel = 'noopener'; }
    }
  }
}

function makeAlerts() {
  const titles = { note: 'Note', tip: 'Tip', important: 'Important', warning: 'Warning', caution: 'Caution' };
  for (const bq of doc.querySelectorAll('blockquote')) {
    const p = bq.firstElementChild;
    if (!p || p.tagName !== 'P') continue;
    const m = /^\s*\[!(NOTE|TIP|IMPORTANT|WARNING|CAUTION)\]\s*(<br>)?\s*/i.exec(p.innerHTML);
    if (!m) continue;
    const type = m[1].toLowerCase();
    p.innerHTML = p.innerHTML.slice(m[0].length);
    if (!p.innerHTML.trim()) p.remove();
    const div = document.createElement('div');
    div.className = 'markdown-alert markdown-alert-' + type;
    div.innerHTML = `<p class="markdown-alert-title">${titles[type]}</p>`;
    div.append(...bq.childNodes);
    bq.replaceWith(div);
  }
}

function addCopyButtons() {
  for (const pre of doc.querySelectorAll('pre:not(.mermaid):not(.plantuml)')) {
    const b = document.createElement('button');
    b.className = 'copy'; b.type = 'button'; b.textContent = 'Copy';
    b.onclick = async () => {
      try { await navigator.clipboard.writeText(pre.querySelector('code')?.innerText ?? pre.innerText); b.textContent = 'Copied'; }
      catch { b.textContent = 'Failed'; }
      setTimeout(() => (b.textContent = 'Copy'), 1200);
    };
    pre.appendChild(b);
  }
}

let tocLinks = [];
function buildToc() {
  const hs = [...doc.querySelectorAll('h1[id], h2[id], h3[id], h4[id]')];
  $('#btn-toc').hidden = hs.length < 2;
  if (hs.length < 2) { toc.hidden = true; tocLinks = []; return; }
  const min = Math.min(...hs.map((h) => +h.tagName[1]));
  toc.innerHTML = '<ul>' + hs.map((h) =>
    `<li><a class="l${+h.tagName[1] - min + 1}" href="#${esc(h.id)}" title="${esc(h.textContent.replace(/^#/, ''))}">${esc(h.textContent.replace(/^#/, ''))}</a></li>`).join('') + '</ul>';
  toc.hidden = store.get('toc') === 'hidden';
  tocLinks = [...toc.querySelectorAll('a')].map((a) => [a, document.getElementById(a.hash.slice(1))]);
  markActive();
}
function markActive() {
  let current = tocLinks[0];
  for (const pair of tocLinks) if (pair[1] && pair[1].getBoundingClientRect().top < 80) current = pair;
  for (const [a] of tocLinks) a.classList.toggle('active', current && a === current[0]);
}
addEventListener('scroll', () => requestAnimationFrame(markActive), { passive: true });

// ---- Loading -------------------------------------------------------------------------------
class BlockedError extends Error {}

function readFileUrl(url) { // fetch() never supports file:, XHR does when the browser allows file->file reads
  return new Promise((resolve, reject) => {
    const x = new XMLHttpRequest();
    try { x.open('GET', url); } catch (e) { reject(new BlockedError(e.message)); return; }
    x.overrideMimeType('text/plain; charset=utf-8');
    x.onload = () => (x.status === 0 || x.status === 200) ? resolve(x.responseText) : reject(new Error('Read failed (status ' + x.status + ')'));
    x.onerror = () => reject(new BlockedError('The browser blocked reading ' + url));
    try { x.send(); } catch (e) { reject(new BlockedError(e.message)); }
  });
}

async function readUrl(url) {
  if (url.startsWith('file:')) return readFileUrl(url);
  const r = await fetch(url, { cache: 'no-store' });
  if (!r.ok) throw new Error(`HTTP ${r.status} ${r.statusText} — ${url}`);
  return r.text();
}

async function readSource() {
  if (source.kind === 'url') return { text: await readUrl(source.url) };
  const file = source.kind === 'handle' ? await source.handle.getFile() : source.file;
  return { text: await file.text(), stamp: file.lastModified + ':' + file.size };
}

const isWinPath = (p) => /^[a-z]:[\\/]/i.test(p);
function pathToFileUrl(p) {
  p = p.replace(/\\/g, '/');
  if (p.startsWith('//')) return 'file:' + p.split('/').map(encodeURIComponent).join('/'); // UNC share
  if (!p.startsWith('/')) p = '/' + p;
  return 'file://' + p.split('/').map((s) => encodeURIComponent(s).replace(/^([a-z])%3A$/i, '$1:')).join('/');
}

class LocalFromWebError extends Error {}
const ON_LOCAL_SERVER = ['127.0.0.1', 'localhost'].includes(location.hostname); // i.e. served by serve.py

// Turns the ?file= value into a URL this page can read.
function resolveParam(v) {
  v = v.trim().replace(/^"(.*)"$/, '$1');
  if (/^https?:/i.test(v)) return v;
  const local = /^file:/i.test(v) ? v : (isWinPath(v) || v.startsWith('\\\\') || (v.startsWith('/') && location.protocol === 'file:')) ? pathToFileUrl(v) : null;
  if (location.protocol === 'file:') return local || new URL(v, location.href).href;
  if (local && !ON_LOCAL_SERVER) throw new LocalFromWebError(v);
  if (local) return location.origin + '/@fs' + new URL(local).pathname;
  return new URL(v, location.href).href;
}

function sourceName() {
  if (!source) return 'mdview';
  if (source.kind !== 'url') return source.name;
  return decodeURIComponent(new URL(source.url).pathname.split('/').pop()) || source.url;
}
function sourceDetail() {
  if (!source) return '';
  if (source.kind === 'url') return fileParamFor(source.url);
  return source.kind === 'handle' ? 'opened file · watching' : 'opened file';
}

async function load(src, { keepScroll = false } = {}) {
  source = src;
  $('#name').innerHTML = esc(sourceName()) + '<small>' + esc(sourceDetail()) + '</small>';
  $('#name').title = sourceDetail();
  $('#btn-reload').hidden = false;
  $('#lbl-watch').hidden = src.kind === 'file';
  try {
    const { text, stamp } = await readSource();
    lastStamp = stamp ?? text;
    await render(text, keepScroll);
    startPolling();
  } catch (e) {
    showError(e);
  }
}

async function poll() {
  if (polling || !source || source.kind === 'file' || document.hidden || !$('#chk-watch').checked) return;
  polling = true;
  try {
    const { text, stamp } = await readSource();
    const s = stamp ?? text;
    if (s !== lastStamp) { lastStamp = s; if (text !== lastText) render(text, true); }
  } catch { /* transient (file mid-save); next tick retries */ }
  finally { polling = false; }
}
function startPolling() { clearInterval(pollTimer); if (source.kind !== 'file') pollTimer = setInterval(poll, POLL_MS); }

// ---- Opening files from disk ---------------------------------------------------------------
async function openPicker() {
  if (window.showOpenFilePicker) {
    try {
      const [handle] = await showOpenFilePicker({
        types: [{ description: 'Markdown', accept: { 'text/markdown': ['.md', '.markdown', '.mdown', '.mkd', '.mdx'], 'text/plain': ['.txt'] } }],
      });
      openHandle(handle);
    } catch (e) { if (e.name !== 'AbortError') $('#picker').click(); }
  } else {
    $('#picker').click();
  }
}
function openHandle(handle) { history.replaceState(null, '', location.pathname); load({ kind: 'handle', handle, name: handle.name }); }
function openFile(file) { history.replaceState(null, '', location.pathname); load({ kind: 'file', file, name: file.name }); }

$('#picker').addEventListener('change', (e) => { if (e.target.files[0]) openFile(e.target.files[0]); e.target.value = ''; });

let dragDepth = 0;
addEventListener('dragenter', (e) => { if (e.dataTransfer.types.includes('Files')) { dragDepth++; document.body.classList.add('dragging'); } });
addEventListener('dragleave', () => { if (--dragDepth <= 0) { dragDepth = 0; document.body.classList.remove('dragging'); } });
addEventListener('dragover', (e) => e.preventDefault());
addEventListener('drop', async (e) => {
  e.preventDefault();
  dragDepth = 0; document.body.classList.remove('dragging');
  const item = [...e.dataTransfer.items].find((i) => i.kind === 'file');
  if (!item) return;
  const handlePromise = item.getAsFileSystemHandle?.(); // must be requested synchronously in the handler
  const file = item.getAsFile();
  const handle = handlePromise && await handlePromise.catch(() => null);
  if (handle && handle.kind === 'file') openHandle(handle); else if (file) openFile(file);
});

// ---- Messages ------------------------------------------------------------------------------
const VIEWER_URL = location.protocol === 'file:' ? location.href.split(/[?#]/)[0] : 'file:///C:/path/to/mdview.html';

function helpHtml() {
  return `
  <div class="drop-hint">Drop a <b>.md</b> file anywhere on this page, or <a href="#" data-open>open one</a>.<br>
  <small>Opened files re-render automatically when they change (Chrome / Edge).</small></div>
  <h3>Opening a file by URL</h3>
  <p>Add <code>?file=</code> with a path or URL, e.g. <code>mdview.html?file=C:\\docs\\notes.md</code> or <code>?file=https://raw.githubusercontent.com/…/README.md</code>.</p>
  <p>Browsers do not let a page opened from <code>file://</code> read other local files, so local paths only work in one of these setups:</p>
  <ol>
    <li><b>Local server (recommended).</b> Run <code>mdview.cmd C:\\docs\\notes.md</code> (or <code>python serve.py &lt;file&gt;</code>) from a local copy of <a href="https://github.com/AlexeyAnischenko/mdview" target="_blank" rel="noopener">mdview</a>. It serves this page on <code>http://127.0.0.1:8765</code> and opens the file there; relative images and links to other <code>.md</code> files work.</li>
    <li><b>Chrome with file access.</b> Start a separate Chrome instance with the flag (it is ignored if Chrome is already running with the same profile):
      <pre>chrome.exe --allow-file-access-from-files --user-data-dir="%LOCALAPPDATA%\\mdview-chrome" "${esc(VIEWER_URL)}?file=C:/docs/notes.md"</pre></li>
  </ol>`;
}

function showHome() {
  doc.hidden = true;
  msg.innerHTML = '<h1>mdview</h1>' + helpHtml();
}

function showError(e) {
  doc.hidden = true; toc.hidden = true; $('#btn-toc').hidden = true;
  const blocked = e instanceof BlockedError || (e instanceof TypeError && location.protocol === 'file:');
  const head = e instanceof LocalFromWebError
    ? `A page opened from the web (<code>${esc(location.host)}</code>) can't read files from your computer. Drop the file on this page or use <b>Open…</b> instead — or run mdview locally (below).`
    : blocked && location.protocol === 'file:'
      ? 'This browser does not let a page opened from <code>file://</code> read other local files. Use one of the options below.'
      : 'Could not load the document.';
  const title = e instanceof LocalFromWebError ? e.message.split(/[\\/]/).pop() : sourceName();
  msg.innerHTML = `<h1>Can't open ${esc(title)}</h1><p class="err">${head}<br><small>${esc(e.message || e)}</small></p>` + helpHtml();
}

msg.addEventListener('click', (e) => { if (e.target.closest('[data-open]')) { e.preventDefault(); openPicker(); } });

// ---- Toolbar & keys ------------------------------------------------------------------------
$('#btn-open').onclick = openPicker;
$('#btn-reload').onclick = () => source && load(source, { keepScroll: true });
$('#btn-theme').onclick = cycleTheme;
$('#btn-toc').onclick = () => { toc.hidden = !toc.hidden; store.set('toc', toc.hidden ? 'hidden' : 'shown'); };
addEventListener('keydown', (e) => {
  if (e.target.closest('input, textarea, [contenteditable]')) return;
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'o') { e.preventDefault(); openPicker(); }
  else if (!e.ctrlKey && !e.metaKey && !e.altKey) {
    if (e.key === 'r' && source) load(source, { keepScroll: true });
    else if (e.key === 't' && !$('#btn-toc').hidden) $('#btn-toc').click();
  }
});

// ---- Start ---------------------------------------------------------------------------------
applyTheme();
const ready = Promise.all(['marked', 'footnote', 'purify', 'hljs'].map(lib)).then(setupMarked);
(async () => {
  await ready;
  const param = new URLSearchParams(location.search).get('file');
  if (param) {
    let url;
    try { url = resolveParam(param); } catch (e) { showError(e); }
    if (url) load({ kind: 'url', url });
  } else {
    showHome();
  }
})();
})();
</script>
